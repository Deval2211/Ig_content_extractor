ai:
  provider: nvidia_nim
  api_key: "${NVIDIA_NIM_API_KEY}"
  base_url: https://integrate.api.nvidia.com/v1
  model: google/gemma-4-31b-it
  fallback_model: meta/muse-glimmer-30b
  max_retries: 5

whisper:
  model: base

paths:
  cookies: cookies.txt
  urls: urls.txt
  tmp: tmp/
  output: output/collections/
  failed: output/failed.txt

processing:
  sequential: true
  retry_attempts: 5
